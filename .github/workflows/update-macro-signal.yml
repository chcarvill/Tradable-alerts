name: Update Macro Signal

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write  # required to push latest_signal.json back into the repo

jobs:
  update-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro engine
        run: python main.py

      - name: Commit and push latest_signal.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_signal.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update macro signal ($(date -u +'%Y-%m-%d'))"
          git push
